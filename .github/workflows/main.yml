name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: traPtitech/traq-markdown-it
    steps:
      - uses: actions/checkout@v6
        with:
          path: traPtitech/traq-markdown-it
      - uses: actions/checkout@v6
        with:
          repository: traq-markdown-parser/sdk
          ref: 585b40ca620924c7af895a118a9722d5c1bfc092
          path: traq-markdown-parser/sdk
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/setup-go@v6
        with:
          go-version-file: traq-markdown-parser/sdk/go/go.mod
          cache-dependency-path: traq-markdown-parser/sdk/go/go.sum
      - run: npm ci
        working-directory: traq-markdown-parser/sdk
      - run: npm run build
        working-directory: traq-markdown-parser/sdk
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:architecture
      - run: npm run check:package
      - run: npx prettier --check src tests examples scripts README.md package.json tsconfig.json

