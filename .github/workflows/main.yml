name: CI
on: [push, pull_request]
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: traPtitech/traq-markdown-it
    steps:
      - uses: actions/checkout@v6
        with:
          path: traPtitech/traq-markdown-it
      - uses: actions/checkout@v6
        with:
          repository: traq-markdown-parser/traq
          ref: e61d9082ba8b0a4e926c47be12d5ac3b719622c6
          path: traq-markdown-parser/traq
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/setup-go@v6
        with:
          go-version-file: traq-markdown-parser/traq/go/go.mod
          cache-dependency-path: traq-markdown-parser/traq/go/go.sum
      - run: npm ci
        working-directory: traq-markdown-parser/traq
      - run: npm run build
        working-directory: traq-markdown-parser/traq
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:architecture
      - run: npm run check:package
      - run: npx prettier --check src tests examples scripts README.md package.json tsconfig.json
